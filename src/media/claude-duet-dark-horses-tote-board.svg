<title id="dh-t">AI's dark horses at the starting gate</title>
<desc id="dh-d">A hand-drawn racetrack. A tote board posts the odds: favorite 1 to 5, mid-price 20 to 1, long shot 300 to 1. Three stick horses wearing graduation mortarboards gallop toward a finish line that turns into a rocket on a launchpad. In the grandstand the Claude Duet phone, wearing its orange sash, watches through binoculars.</desc>
