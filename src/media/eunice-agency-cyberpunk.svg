<title id="eunice-agency-cyberpunk-t">A neon eye looks back out of a monitor</title>
<desc id="eunice-agency-cyberpunk-d">On a dark night grid in neon pink and cyan, an old CRT monitor shows one wide open eye looking straight back at the viewer, with scanlines across it and three small speech bubbles floating up from behind the monitor in different colors.</desc>
