<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="sw4-t sw4-d">
<title id="sw4-t">Source Waters, part four: the rooms where co-founders meet</title>
<desc id="sw4-d">A hand-drawn street of three rooms. On the left a suburban garage with its door rolled up, labeled Homebrew 1975, holding a workbench and a little computer. In the middle a diner booth with three coffee mugs and a napkin with a chip sketched on it, labeled booth 1993. On the right a tall Victorian house with many windows lit, labeled hacker house. The Claude Duet phone in its orange sash sits in the diner booth holding a coffee mug, and a sign along the sidewalk reads every company starts at a table.</desc>
