<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="sw5-t sw5-d">
<title id="sw5-t">Source Waters, part five: the schools and families upstream</title>
<desc id="sw5-d">A hand-drawn family tree whose roots run down into a small spring. Its branches hold little tags reading Lakeside 1968, TJ, Baton Rouge, Saint Louis, and Pop-Pop. Under the tree a kitchen table holds an old camera, a roll of film and a computer terminal. The Claude Duet phone in its orange sash sits on the table holding the camera up to its face, and a hand-lettered line reads the first domino is a kitchen table.</desc>
