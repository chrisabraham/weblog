<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="bec-t bec-d">
<title id="bec-t">The bleeding edge waits on the checkers</title>
<desc id="bec-d">A hand-drawn lab door marked frontier pushes four boxes onto a conveyor belt: proof, qubit, organoid, and am I conscious. Below the belt, a long queue of six tiny human checkers holds magnifying glasses. At the end of the line the Claude Duet phone, wearing its orange sash, holds a clipboard that reads take a number.</desc>
