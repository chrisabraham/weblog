<title id="the-experimental-aircraft-is-still-an-aircraft-t">A homebuilt airplane with an EXPERIMENTAL placard and a checklist</title>
<desc id="the-experimental-aircraft-is-still-an-aircraft-d">A small homebuilt propeller airplane sits on a grass strip, its side painted with the word EXPERIMENTAL, while a clipboard checklist leans against the wheel with three boxes ticked: prompt, source, dated note.</desc>
