<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="sw1-t sw1-d">
<title id="sw1-t">Source Waters, part one: the universities upstream of AI</title>
<desc id="sw1-d">A hand-drawn map of a river. At the bottom right the river fans into a crowded delta full of little boats flying dollar flags and a sign reading everyone's at the delta. Upstream, tributaries labeled CMU, Berkeley, Stanford, Toronto, Illinois and Tsinghua join the main channel, each fed by a chip or a curly brace. At the top left a small spring bubbles out from under a graduation mortarboard, labeled source waters. The Claude Duet phone, wearing its orange sash, paddles a canoe upstream toward the spring.</desc>
