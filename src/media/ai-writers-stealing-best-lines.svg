<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
<title id="title">The editor hands over his best lines</title>
<desc id="description">An eccentric vintage newspaper office in warm midnight colors. A human hand at the left writes assignments with a red fountain pen. Three friendly mechanical typewriter birds at the right turn the borrowed red ink into separate printed pages. Copper tubes carry the ink through a transparent glass panel where the whole editorial process remains visible. A tiny amber light winks above the printing press. A lotus grows out of a stack of archived papers.</desc>
<defs>
<pattern id="paper-grain" width="31" height="31" patternUnits="userSpaceOnUse"><circle cx="6" cy="9" r="1" fill="#987957" opacity=".15"/><circle cx="22" cy="23" r=".8" fill="#987957" opacity=".18"/></pattern>
<linearGradient id="night" x2=".9" y2="1"><stop stop-color="#1c3040"/><stop offset="1" stop-color="#293f46"/></linearGradient>
<linearGradient id="light" x2="1" y2="1"><stop stop-color="#f5d19a"/><stop offset="1" stop-color="#bd8058"/></linearGradient>
<style>
.ink-flow{stroke-dasharray:7 17;animation:flow 11s linear infinite}
@keyframes flow{to{stroke-dashoffset:-144}}
.lamp{animation:blink 8s ease-in-out infinite}
@keyframes blink{0%,87%,100%{opacity:.8}90%,94%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.ink-flow,.lamp{animation:none}}
</style>
</defs>
<rect width="1200" height="675" rx="14" fill="url(#night)"/>
