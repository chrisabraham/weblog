<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">The assigning editor's porch</title><desc id="desc">At twilight a warm lamp illuminates a wooden table with four empty chairs, a red editorial pencil, a notebook, three assignment envelopes and a laptop. A small amber light blinks inside the laptop.</desc><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#152a43"/><stop offset=".6" stop-color="#3d5365"/><stop offset="1" stop-color="#c58a63"/></linearGradient><linearGradient id="wood" x2="0" y2="1"><stop stop-color="#704a36"/><stop offset="1" stop-color="#2d2324"/></linearGradient><radialGradient id="lamp"><stop stop-color="#ffd990" stop-opacity=".58"/><stop offset="1" stop-color="#ffd990" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="675" fill="url(#sky)"/><path d="M0 400Q110 320 210 388T440 379T700 397T940 360T1200 390V675H0" fill="#20384a"/><path d="M0 460Q160 410 340 450T700 438T1200 452V675H0" fill="#152e3c"/><rect y="494" width="1200" height="181" fill="url(#wood)"/><g stroke="#aa7653" stroke-width="4" opacity=".5"><path d="M0 535h1200M0 594h1200M0 648h1200"/></g><g fill="#2e2221"><path d="M0 0h1200v35H0zM60 0h28v495H60zM1112 0h28v495h-28z"/></g><g fill="none" stroke="#b18157" stroke-width="11"><path d="M55 475h1090M55 408h1090"/></g><circle cx="605" cy="255" r="270" fill="url(#lamp)"/><path d="M600 0v174" stroke="#1c1a20" stroke-width="6"/><path d="M557 175h86l-19 75h-48z" fill="#3b2b29" stroke="#f6c77d" stroke-width="5"/><path d="M580 182h40l-10 52h-20z" fill="#ffe0a1"/><g fill="#1b252b" stroke="#c59b6b" stroke-width="9"><path d="M85 385q0-70 73-70t73 70v175H85z"/><path d="M342 380q0-75 73-75t73 75v182H342z"/><path d="M712 380q0-75 73-75t73 75v182H712z"/><path d="M972 385q0-70 73-70t73 70v175H972z"/></g><path d="M215 477h770l68 95H146z" fill="#b27a53" stroke="#50352d" stroke-width="13"/><path d="M150 570h905v35H150z" fill="#4b312b"/><g transform="translate(300 472) rotate(-8)"><rect width="185" height="88" rx="4" fill="#e9d7b1" stroke="#674c38" stroke-width="5"/><path d="M18 20h148M18 38h130M18 56h142" stroke="#b4a58b" stroke-width="4"/></g><g transform="translate(555 456) rotate(7)"><rect width="150" height="97" rx="6" fill="#e4d1a8" stroke="#59452e" stroke-width="5"/><path d="M10 15l65 42 65-42" fill="none" stroke="#ab8c64" stroke-width="5"/></g><path d="M745 455h155l19 92H727z" fill="#1c2630" stroke="#a6b4ba" stroke-width="7"/><path d="M740 550h193" stroke="#758d98" stroke-width="12"/><circle cx="835" cy="500" r="6" fill="#ffa73b"><animate attributeName="opacity" values=".2;1;.2" dur="3.4s" repeatCount="indefinite"/></circle><path d="M488 545l172-53" stroke="#9e142b" stroke-width="13" stroke-linecap="round"/><path d="M662 492l-20 18-5-17z" fill="#f5e7cb"/><g fill="#e5c48f"><circle cx="260" cy="601" r="3"/><circle cx="455" cy="625" r="2"/><circle cx="805" cy="615" r="3"/></g></svg>