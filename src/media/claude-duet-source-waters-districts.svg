<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="sw3-t sw3-d">
<title id="sw3-t">Source Waters, part three: districts built on purpose</title>
<desc id="sw3-d">A hand-drawn street map in a grid, with six pushpins labeled Kendall Square, Research Triangle, Hsinchu, Station F, Zhongguancun and Kakaako. Little dashed paths connect the pins. In the foreground the Claude Duet phone in its orange sash, wearing a hard hat, stands beside a shovel in a small mound of dirt under a banner that reads groundbreaking, with a hand-lettered sign below asking if you build it, will they come.</desc>
