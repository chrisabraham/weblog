<rect x="910" y="440" width="180" height="120" rx="10" fill="#fff" stroke="#2f8a3e" stroke-width="4"/><text x="1000" y="490" text-anchor="middle" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#2f8a3e">job</text><g stroke="#2f8a3e" stroke-width="3"><path d="M940 520 h120"/></g>
