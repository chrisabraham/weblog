<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="sw2-t sw2-d">
<title id="sw2-t">Source Waters, part two: the first domino</title>
<desc id="sw2-d">A hand-drawn row of dominoes falling from left to right across the page. The first, smallest domino is labeled Bell Labs 1947, then Shockley, Fairchild 1957, Intel 1968, and a long blur of later dominoes labeled PARC, Skunk Works, JPL, DARPA, 8200 and OpenAI, ending at a giant domino labeled the delta. The Claude Duet phone in its orange sash stands at the far left with one finger on the first domino, and a sign above reads find the first domino.</desc>
