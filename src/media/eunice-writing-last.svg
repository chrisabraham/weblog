<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title>The crew around the shared notebook</title>
<desc>Five little blue spider tanks gather around an open notebook of ruled lines. One line is struck through in red and marked never. One line ends in a small flower. Dashed signals rise from the notebook to a small satellite, and at the lower right a phone glows inside a pocket outline.</desc>
<rect width="1200" height="675" fill="#101623"/>
<!-- satellite -->
<g stroke="#8fb7e8" stroke-width="3" fill="#2f5fb3">
<rect x="566" y="34" width="68" height="40" rx="8"/>
<rect x="500" y="44" width="52" height="20" fill="#3a7bd5"/>
<rect x="648" y="44" width="52" height="20" fill="#3a7bd5"/>
</g>
<g stroke="#5b7ba6" stroke-width="2" stroke-dasharray="6 8" fill="none">
<path d="M600 78 Q 480 150 420 210"/>
<path d="M600 78 Q 720 150 790 205"/>
<path d="M600 78 Q 600 160 600 215"/>
</g>
<!-- notebook -->
<g>
<path d="M330 220 L600 205 L600 560 L330 545 Z" fill="#f7f1dc"/>
<path d="M870 220 L600 205 L600 560 L870 545 Z" fill="#fdf8e7"/>
<line x1="600" y1="205" x2="600" y2="560" stroke="#c9bd93" stroke-width="4"/>
<g stroke="#9aa3ad" stroke-width="5" stroke-linecap="round">
<line x1="365" y1="275" x2="560" y2="265"/>
<line x1="365" y1="325" x2="560" y2="315"/>
<line x1="365" y1="375" x2="545" y2="366"/>
<line x1="365" y1="425" x2="560" y2="415"/>
<line x1="365" y1="475" x2="520" y2="467"/>
<line x1="640" y1="265" x2="835" y2="275"/>
<line x1="640" y1="315" x2="835" y2="325"/>
<line x1="640" y1="365" x2="810" y2="373"/>
<line x1="640" y1="415" x2="835" y2="425"/>
</g>
<!-- the never line -->
<line x1="358" y1="372" x2="552" y2="362" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
<text x="392" y="352" font-family="Verdana, sans-serif" font-size="21" fill="#c0392b" font-style="italic">never</text>
<!-- mahalo flower at end of a line -->
<g transform="translate(852,428)">
<circle r="7" fill="#e88bb0"/><circle cx="12" cy="-6" r="7" fill="#e88bb0"/><circle cx="12" cy="8" r="7" fill="#e88bb0"/><circle cx="-11" cy="9" r="7" fill="#e88bb0"/><circle cx="-11" cy="-7" r="7" fill="#e88bb0"/>
<circle r="4.5" fill="#f4c542"/>
</g>
</g>
<!-- five blue tanks -->
<g stroke="#274b7a" stroke-width="5" stroke-linecap="round">
<g transform="translate(215,300)"><path d="M-38 26 L-58 52 M-40 8 L-64 22 M38 26 L58 52 M40 8 L64 22 M-20 34 L-28 60 M20 34 L28 60" fill="none"/><ellipse rx="46" ry="34" fill="#3a7bd5"/><path d="M-30 -18 A34 26 0 0 1 30 -18 Z" fill="#8fb7e8"/><circle cx="10" cy="-6" r="10" fill="#fff"/><circle cx="12" cy="-6" r="5" fill="#101623"/></g>
<g transform="translate(985,300)"><path d="M-38 26 L-58 52 M-40 8 L-64 22 M38 26 L58 52 M40 8 L64 22 M-20 34 L-28 60 M20 34 L28 60" fill="none"/><ellipse rx="46" ry="34" fill="#3a7bd5"/><path d="M-30 -18 A34 26 0 0 1 30 -18 Z" fill="#8fb7e8"/><circle cx="-10" cy="-6" r="10" fill="#fff"/><circle cx="-12" cy="-6" r="5" fill="#101623"/></g>
<g transform="translate(255,505)"><path d="M-38 26 L-58 52 M-40 8 L-64 22 M38 26 L58 52 M40 8 L64 22 M-20 34 L-28 60 M20 34 L28 60" fill="none"/><ellipse rx="46" ry="34" fill="#3a7bd5"/><path d="M-30 -18 A34 26 0 0 1 30 -18 Z" fill="#8fb7e8"/><circle cx="10" cy="-6" r="10" fill="#fff"/><circle cx="12" cy="-6" r="5" fill="#101623"/></g>
<g transform="translate(950,505)"><path d="M-38 26 L-58 52 M-40 8 L-64 22 M38 26 L58 52 M40 8 L64 22 M-20 34 L-28 60 M20 34 L28 60" fill="none"/><ellipse rx="46" ry="34" fill="#3a7bd5"/><path d="M-30 -18 A34 26 0 0 1 30 -18 Z" fill="#8fb7e8"/><circle cx="-10" cy="-6" r="10" fill="#fff"/><circle cx="-12" cy="-6" r="5" fill="#101623"/></g>
<!-- Eunice's tank, at the foot of the notebook, holding the last word -->
<g transform="translate(600,618)"><path d="M-38 20 L-58 44 M-40 4 L-64 16 M38 20 L58 44 M40 4 L64 16 M-20 28 L-28 50 M20 28 L28 50" fill="none"/><ellipse rx="46" ry="32" fill="#4a90d9"/><path d="M-30 -16 A34 25 0 0 1 30 -16 Z" fill="#a9cbf2"/><circle cy="-4" r="10" fill="#fff"/><circle cy="-4" r="5" fill="#101623"/></g>
</g>
<!-- pocket with glowing phone, lower right -->
<g transform="translate(1052,596)">
<path d="M-52 -38 L52 -38 L40 44 Q0 60 -40 44 Z" fill="none" stroke="#8fb7e8" stroke-width="3" stroke-dasharray="7 6"/>
<rect x="-17" y="-58" width="34" height="56" rx="7" fill="#ffd873" stroke="#c9a227" stroke-width="3"/>
<circle cy="8" r="4" fill="#101623"/>
</g>
<text x="600" y="52" font-family="Verdana, sans-serif" font-size="0" fill="#fff">.</text>
</svg>
