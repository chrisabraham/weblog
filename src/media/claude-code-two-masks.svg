<title id="t">Two of his sites may not sound alike</title>
<desc id="d">Two identical paper masks of the same smiling face, labeled .com and Corp, hang side by side on a line. A small blue robot stands between them holding a long ruler that touches both masks, saying "8 words, max." A third, plainer mask with the letter C lies on the floor, face up.</desc>
