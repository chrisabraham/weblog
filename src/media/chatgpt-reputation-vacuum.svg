<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The hungry search machine and the empty reputation</title>
<desc id="desc">In a night archive, a whimsical green carnivorous plant sits inside a search engine shaped terrarium, drawn toward an empty dark nameplate on the left. On the right, a person carefully assembles real letters, photographs, timelines and civic records into a warm illuminated shelf. A pencil rests beside an unlocked diary; the bright archive pushes light into the empty space.</desc>
