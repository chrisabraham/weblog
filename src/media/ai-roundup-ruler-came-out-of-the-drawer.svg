<path d="M0 600 h1200" stroke="#7a9ab0" stroke-width="3"/>
<rect x="250" y="420" width="560" height="180" fill="#c9965a" stroke="#7a5a00" stroke-width="5"/>
<rect x="330" y="470" width="400" height="90" fill="#b07c42" stroke="#7a5a00" stroke-width="5"/><circle cx="530" cy="515" r="10" fill="#7a5a00"/>
<g transform="rotate(-18 520 470)"><rect x="490" y="110" width="60" height="380" fill="#f2c14e" stroke="#7a5a00" stroke-width="4"/>
<g stroke="#7a5a00" stroke-width="3"><path d="M490 150 h22 M490 190 h14 M490 230 h22 M490 270 h14 M490 310 h22 M490 350 h14 M490 390 h22 M490 430 h14"/></g>
<text x="0" y="0" transform="translate(540 440) rotate(-90)" font-family="Verdana, sans-serif" font-size="26" font-weight="bold" fill="#1d2a33">perplexity</text></g>
<g fill="none" stroke="#16729e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M820 120 v300 h330"/><path d="M840 150 q60 220 300 250" stroke="#c75000"/></g>
<text x="985" y="470" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" fill="#16729e">the curve they actually use</text>
</svg>
