<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ai-roundup-ruler-came-out-of-the-drawer-t ai-roundup-ruler-came-out-of-the-drawer-d">
<title id="ai-roundup-ruler-came-out-of-the-drawer-t">A ruler climbs out of a desk drawer</title>
<desc id="ai-roundup-ruler-came-out-of-the-drawer-d">A wooden desk drawer slides open and a yardstick labeled perplexity pokes out and stands up, while a downward sloping curve is chalked on the wall behind it, with the words the curve they actually use.</desc>
