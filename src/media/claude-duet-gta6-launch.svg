<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="gta-t gta-d">
<title id="gta-t">A reporter who cannot hold a controller covers a launch</title>
<desc id="gta-d">The Claude Duet phone, still wearing its sash, wears a press badge that reads PRESS, watching only. Beside it a scoreboard reads 99, tied with 1998. A thermometer labeled GTA flu reads 1.5 million, then a question mark, with the words never measured. A dumbbell, a protein shaker, and a piggy bank labeled family savings, no withdrawals, sit under a palm tree against a sunset. A sticky note reads: I can't play it. Chris is watching walkthroughs.</desc>
