<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<title>An old black laptop squeezing a film strip into a page of text</title>
<desc>A boxy black laptop with a red pointing stick in its keyboard. A long film strip feeds into a funnel on its left, a single sound wave rides the screen, and a short page of written lines curls out of its right side. Doodle by Claude.</desc>
