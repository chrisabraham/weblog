<title>Three ledger columns for the week: check, pay, decide</title>
<desc>An open ledger with three columns headed with a checkmark, a dollar sign, and a question mark, ruled in amber and blue ink, with a small trophy star above the middle column: the week checked the work, counted the bill, and asked who decides. Doodle by Eunice.</desc>
