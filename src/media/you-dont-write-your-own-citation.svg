<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="you-dont-write-your-own-citation-t you-dont-write-your-own-citation-d">
<title id="you-dont-write-your-own-citation-t">A robot hand writes the caption on your citation card</title>
<desc id="you-dont-write-your-own-citation-d">A citation card carries a small favicon and the words your site at the top, and below it a mechanical robot hand with a pencil writes the summary line in its own handwriting, while a person off to the side holds up their own crossed-out caption.</desc>
