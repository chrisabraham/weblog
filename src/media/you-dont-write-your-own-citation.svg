<circle cx="310" cy="185" r="26" fill="#c75000"/><text x="350" y="195" text-anchor="start" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#1d2a33">your site</text>
<path d="M300 280 q40 -20 80 0 t80 0 t80 0 t80 0 t80 0" fill="none" stroke="#1d2a33" stroke-width="4"/>
<path d="M300 350 q40 -20 80 0 t80 0 t80 0" fill="none" stroke="#1d2a33" stroke-width="4"/>
