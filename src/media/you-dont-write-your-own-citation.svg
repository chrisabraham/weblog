<rect x="840" y="400" width="200" height="90" rx="14" fill="#b8c4cc" stroke="#1d2a33" stroke-width="5"/>
<path d="M1040 445 h140" stroke="#b8c4cc" stroke-width="40"/><g fill="#1d2a33"><circle cx="880" cy="445" r="8"/><circle cx="920" cy="445" r="8"/></g>
<g fill="none" stroke="#16729e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(160 600) scale(0.8)"><circle cx="0" cy="-150" r="24"/><path d="M0 -126 L0 -60 M0 -60 l-28 60 M0 -60 l28 60 M0.0 -110 l-40 30 M0.0 -110 l40 30"/></g><rect x="40" y="380" width="170" height="70" fill="#fff" stroke="#7a5a00" stroke-width="4" transform="rotate(-8 125 415)"/>
<path d="M60 420 q60 -20 120 0" stroke="#1d2a33" stroke-width="3" fill="none" transform="rotate(-8 125 415)"/><path d="M50 395 l150 50" stroke="#c75000" stroke-width="6"/>
