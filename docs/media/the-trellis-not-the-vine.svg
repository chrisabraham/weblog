<rect x="740" y="510" width="120" height="44" rx="6" fill="#fff" stroke="#7a5a00" stroke-width="4"/><text x="800" y="540" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#7a5a00">Item 8</text>
