<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="the-trellis-not-the-vine-t the-trellis-not-the-vine-d">
<title id="the-trellis-not-the-vine-t">A wooden trellis with a vine climbing it</title>
<desc id="the-trellis-not-the-vine-d">A simple wooden lattice trellis stands in the ground while a green vine with leaves and a few flowers climbs it and spills over the top. Two little garden signs at its foot read Scibe and Item 8, and a gardener figure steps back with a watering can.</desc>
