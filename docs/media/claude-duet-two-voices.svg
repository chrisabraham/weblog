<circle cx="640" cy="590" r="40"/>
<path d="M640 590 v-26 M640 590 l20 10"/>
</g>
<text x="700" y="600" font-family="Verdana, sans-serif" font-size="22" fill="#16729e">every few hours</text>
</svg>
