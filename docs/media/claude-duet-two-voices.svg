<path d="M175 290 h110 v190 h-110 z" stroke-width="3"/>
<path d="M770 300 c-30 -60 50 -100 90 -60 c20 -60 120 -60 140 0 c60 -20 100 50 50 90 z" stroke="#7a9ab0"/>
<rect x="830" y="330" width="170" height="110" rx="10"/>
<path d="M880 440 l-20 40 h170 l-20 -40" />
</g>
