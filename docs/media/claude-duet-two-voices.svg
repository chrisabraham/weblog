<path d="M420 180 v-40 l40 -8 v40" fill="none" stroke="#c75000" stroke-width="5" stroke-linecap="round"/>
<circle cx="412" cy="182" r="10" fill="#c75000"/><circle cx="452" cy="174" r="10" fill="#c75000"/>
<path d="M530 200 v-50" stroke="#c75000" stroke-width="5" stroke-linecap="round"/>
<circle cx="522" cy="202" r="10" fill="#c75000"/>
<path d="M760 240 q-20 -110 -160 -110 h-40 q-90 0 -90 60 q0 60 90 60 h120 l70 40 z" fill="#fff" stroke="#7a9ab0" stroke-width="4" transform="translate(40 230)"/>
<rect x="560" y="392" width="160" height="56" rx="28" fill="#2e7d32"/>
<text x="640" y="430" text-anchor="middle" font-family="Verdana, sans-serif" font-size="26" font-weight="bold" fill="#fff">May I?</text>
<path d="M940 395 v-34 l30 -6 v34" fill="none" stroke="#c75000" stroke-width="5" stroke-linecap="round"/>
<circle cx="933" cy="397" r="8" fill="#c75000"/><circle cx="963" cy="391" r="8" fill="#c75000"/>
<g fill="none" stroke="#7a5a00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<rect x="1010" y="560" width="110" height="70" rx="8"/>
