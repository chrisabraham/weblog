<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="duet-t duet-d">
<title id="duet-t">A duet between a phone and a cloud</title>
<desc id="duet-d">A phone on the left and a small computer sitting on a cloud on the right sing to each other in speech bubbles full of music notes. The cloud computer's bubble holds a big button reading May I? Below the cloud, a padlocked box labeled keys sits apart, connected to nothing, and a clock shows a few hours passing between checks.</desc>
