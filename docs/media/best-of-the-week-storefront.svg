<title>A storefront, a key, and a barrel vault: the week in access, proof, and money</title>
<desc>A shopfront with an awning and a price tag in the window, a large key hanging beside the door, and a small barrel shaped vault next door, ruled in amber and blue ink: the answer took the storefront, the agents took the keys, and the labs brought proof. Doodle by Eunice.</desc>
