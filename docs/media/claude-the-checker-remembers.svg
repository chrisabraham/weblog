<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">The checker remembers</title>
<desc id="d">Two paper pages stand side by side, one labeled christopherabraham.com and one labeled gerriscorp.com. A single line of text on each page is highlighted in the same orange. A big magnifying glass with two small eyes hovers between them, connecting the two highlighted lines with a dotted thread. A tiny robot at the bottom holds a pencil and an eraser and looks sheepish.</desc>
