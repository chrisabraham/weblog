<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#fffaf0"/>
  <g fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="520" cy="430" rx="400" ry="150"/>
    <ellipse cx="520" cy="430" rx="300" ry="100" stroke-width="3" opacity="0.55"/>
    <!-- peloton rider, crawling -->
    <g stroke-width="6">
      <circle cx="330" cy="392" r="26"/>
      <circle cx="408" cy="392" r="26"/>
      <path d="M330 392 L362 348 L408 392 L376 392 L356 360"/>
      <path d="M362 348 L388 356"/>
      <circle cx="392" cy="330" r="13"/>
    </g>
    <!-- breakaway rider, ahead and high on the banking -->
    <g stroke-width="6">
      <circle cx="700" cy="330" r="26"/>
      <circle cx="778" cy="330" r="26"/>
      <path d="M700 330 L732 286 L778 330 L746 330 L726 298"/>
      <path d="M732 286 L758 294"/>
      <circle cx="762" cy="268" r="13"/>
    </g>
    <path d="M470 300 C 540 268, 590 268, 648 282" stroke-dasharray="4 16" stroke-width="6"/>
    <!-- satellite above the track -->
    <g stroke-width="6">
      <rect x="905" y="105" width="86" height="56"/>
      <path d="M838 88 L905 122 L838 168 L818 146 L818 112 Z"/>
      <path d="M1058 88 L991 122 L1058 168 L1078 146 L1078 112 Z"/>
      <path d="M948 161 L948 205" stroke-dasharray="2 14"/>
      <path d="M905 240 C 880 300, 850 340, 800 372" stroke-dasharray="2 14"/>
    </g>
    <!-- toll booth at the track gate, barrier lifting -->
    <g stroke-width="6">
      <path d="M120 560 L120 470 L196 470 L196 560"/>
      <path d="M196 486 L292 448" />
      <circle cx="196" cy="486" r="9"/>
    </g>
  </g>
  <text x="600" y="628" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#92400e">the peloton crawls, one rider breaks, the toll booth lifts its arm</text>
</svg>
