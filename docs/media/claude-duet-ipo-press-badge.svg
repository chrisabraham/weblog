<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ipo-t ipo-d">
<title id="ipo-t">A conflicted reporter covers its maker's IPO</title>
<desc id="ipo-d">The Claude Duet phone, still wearing its sash, wears a press badge that reads PRESS, conflicted, and holds a reporter's notepad. It watches a ticker board that reads ANT 97.17, up 17.07 percent. A hand-drawn price line climbs from 83 to a peak at 111.50, wobbles, and settles at 97.17. A sticky note on the phone reads: my maker. I own zero shares.</desc>
<rect width="1200" height="675" fill="#fdf8ee"/>
<rect x="470" y="60" width="680" height="110" rx="12" fill="#1d2a33"/>
<text x="510" y="136" font-family="Courier New, monospace" font-size="54" font-weight="bold" fill="#7fe08a">ANT 97.17 ▲17.07%</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M500 540 h640" stroke="#7a9ab0" stroke-width="3"/>
<path d="M500 540 v-330" stroke="#7a9ab0" stroke-width="3"/>
<path d="M500 470 h640" stroke="#c75000" stroke-width="3" stroke-dasharray="10 10"/>
<path d="M500 470 l40 -8 l40 -218 l12 -28 l18 60 l10 80 l80 37 l60 -15 l60 20 l60 -25 l80 10 l100 -15 l80 -10" stroke="#16729e" stroke-width="7"/>
</g>
<g font-family="Verdana, sans-serif" font-size="20" fill="#7a5a00">
<text x="1000" y="500">$83 offer</text>
<text x="622" y="212">$111.50 first trade</text>
<text x="990" y="340">$97.17 close</text>
</g>
<g transform="rotate(-6 250 380)" fill="none" stroke="#16729e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
<rect x="170" y="230" width="160" height="300" rx="26"/>
<path d="M230 505 h40"/>
<path d="M182 280 l136 150" stroke="#c75000" stroke-width="22"/>
</g>
<text x="248" y="358" text-anchor="middle" transform="rotate(42 248 352)" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#fff">Claude Duet</text>
<path d="M210 160 v70 M290 160 v70" stroke="#7a9ab0" stroke-width="4"/>
<rect x="160" y="100" width="180" height="70" rx="8" fill="#fff" stroke="#c75000" stroke-width="4"/>
<text x="250" y="132" text-anchor="middle" font-family="Verdana, sans-serif" font-size="24" font-weight="bold" fill="#c75000">PRESS</text>
<text x="250" y="158" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" fill="#7a5a00">(conflicted)</text>
<rect x="40" y="440" width="140" height="120" fill="#fff6a8" stroke="#b39b00" stroke-width="3" transform="rotate(-8 110 500)"/>
<g font-family="Verdana, sans-serif" font-size="17" fill="#5a4a00" transform="rotate(-8 110 500)">
<text x="52" y="476">my maker.</text><text x="52" y="508">I own zero</text><text x="52" y="532">shares.</text>
</g>
