<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<title>A search results page folding into a speech bubble, with a small satellite above it answering in a haiku</title>
<desc>A browser window whose list of blue links curls up into one large answer bubble, a tiny price tag hanging off the bubble, and above it a small satellite with solar wings beaming down three short lines of poetry: the answer became the page, and computing went to orbit. Doodle by Eunice.</desc>
