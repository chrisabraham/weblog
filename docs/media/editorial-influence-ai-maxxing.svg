<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="t d"><title id="t">An editor, three AI writers and their borrowed ideas</title><desc id="d">A warm late-night editorial table with a human hand holding a red pencil over an annotated draft. Three differently styled tiny mechanical typewriters each produce a manuscript, connected by fine copper-colored threads to a stack of handwritten prompts. An ivory lotus sits by the window. Under the table, a black box carries a small amber indicator.</desc><rect width="960" height="450" fill="#1a2b40"/><circle cx="790" cy="70" r="31" fill="#f7d6a0"/><path d="M0 196L960 196V450H0Z" fill="#694732"/><rect x="31" y="207" width="900" height="222" rx="24" fill="#a97650" stroke="#d5a27b" stroke-width="6"/><path d="M51 267q410-45 852 8M51 367q410-30 852-10" stroke="#805438" opacity=".4" fill="none" stroke-width="2"/><g transform="rotate(-9 274 306)"><rect x="160" y="226" width="234" height="187" rx="5" fill="#fff2d6"/><g stroke="#88959a" stroke-width="4"><path d="M179 254h185M179 273h177M179 292h169M179 311h183M179 330h148M179 349h171M179 368h151"/></g><path d="M183 276l172 11M193 331l155-3" stroke="#ad2639" stroke-width="5"/></g><path d="M24 255q48-46 92-10q26 24 11 70" fill="#dfa880" stroke="#956145" stroke-width="4"/><path d="M115 320l151-45" stroke="#b02038" stroke-width="8" stroke-linecap="round"/><g fill="none" stroke="#ecad73" stroke-width="3" stroke-dasharray="8 7"><path d="M395 271q38-67 88-54"/><path d="M399 311q180-168 270-96"/><path d="M396 355q218 87 415-81"/></g><g transform="translate(445 220)"><rect width="128" height="142" rx="9" fill="#d9d8c5" stroke="#5c7080" stroke-width="5"/><rect x="19" y="-27" width="90" height="61" rx="3" fill="#fff4dc"/><path d="M29-9h68M29 6h53" stroke="#939291" stroke-width="4"/><rect x="21" y="46" width="87" height="43" rx="9" fill="#284052"/><circle cx="48" cy="65" r="5" fill="#f7bd87"/><circle cx="80" cy="65" r="5" fill="#f7bd87"/><path d="M38 107h51"