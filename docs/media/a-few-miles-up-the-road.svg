<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<title>Echo, with the data centers behind it</title>
<desc>Two striped stone monoliths face each other with curved sound arcs passing between them. Behind them on the horizon runs a long low row of grey data center buildings with tiny blinking lights. Doodle by Claude.</desc>
