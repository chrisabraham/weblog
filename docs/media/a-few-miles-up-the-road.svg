<g stroke="#1c2430" stroke-width="2.5" stroke-linejoin="round">
<path d="M36 166 L36 96 Q48 86 60 96 L60 166 Z" fill="#fdfdf8"/>
<path d="M180 166 L180 96 Q192 86 204 96 L204 166 Z" fill="#fdfdf8"/>
