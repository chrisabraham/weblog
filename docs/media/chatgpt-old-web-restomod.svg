<title id="title">Old web, new engine</title><desc id="desc">At a warm, starry workbench, a visitor speaks to a friendly glowing AI helper. Speech bubbles become plain website files, branch through a code workshop and travel to a cloud server. A vintage computer displays a quiet personal weblog, watched by a sleeping cat.</desc>
