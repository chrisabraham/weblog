<title id="eight-of-eighty-three-t">Eighty-three jobs go into a funnel and eight come out</title>
<desc id="eight-of-eighty-three-d">A crowd of eighty-three small job cards tumbles into a big orange funnel with a tag on it that reads cap: 8, set in early October. Only eight cards drip out the bottom into a tray, while a little figure points at the tag and asks why eight?</desc>
