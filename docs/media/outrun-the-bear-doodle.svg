<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="outrun-the-bear-doodle-t outrun-the-bear-doodle-d">
<title id="outrun-the-bear-doodle-t">Two runners on a forest trail with a bear behind them</title>
<desc id="outrun-the-bear-doodle-d">On a pine forest trail two stick-figure runners sprint, one a step ahead of the other, while a big brown bear lumbers behind them. The trailing runner ignores the bear and keeps his eyes on the runner ahead, and a small trail sign reads you only need to beat the other guy.</desc>
