<g fill="none" stroke="#16729e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(640 590) rotate(12)"><circle cx="0" cy="-150" r="24"/><path d="M0 -126 L0 -60 l-40 55 M0 -60 l40 60 M0 -110 l-45 25 M0 -110 l45 -30"/></g>
<g fill="none" stroke="#c75000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(860 590) rotate(14)"><circle cx="0" cy="-150" r="24"/><path d="M0 -126 L0 -60 l-45 55 M0 -60 l45 60 M0 -110 l-50 20 M0 -110 l50 -30"/></g>
<path d="M672 425 L868 445" fill="none" stroke="#7a9ab0" stroke-width="3" stroke-dasharray="6 8"/><circle cx="668" cy="430" r="4" fill="#1d2a33"/>
<g stroke="#7a5a2b" stroke-width="8"><path d="M1080 600 v-120"/></g><rect x="990" y="400" width="190" height="70" rx="6" fill="#fff" stroke="#7a5a2b" stroke-width="4"/>
