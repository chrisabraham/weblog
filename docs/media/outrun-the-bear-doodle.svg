<g fill="#7a4a24" stroke="#4a2a14" stroke-width="4"><ellipse cx="300" cy="490" rx="120" ry="70"/><circle cx="420" cy="440" r="50"/><circle cx="400" cy="395" r="16"/><circle cx="445" cy="395" r="16"/>
