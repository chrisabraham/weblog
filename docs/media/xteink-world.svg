<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" role="img" aria-label="A phone with a small e-reader magnetized to its back and a tiny book beside it">
  <rect x="0" y="0" width="340" height="260" fill="none"/>
  <!-- phone -->
  <rect x="118" y="18" width="104" height="224" rx="16" fill="none" stroke="#b45309" stroke-width="3"/>
  <rect x="152" y="28" width="36" height="5" rx="2.5" fill="#b45309"/>
  <circle cx="170" cy="226" r="5" fill="none" stroke="#b45309" stroke-width="2"/>
  <!-- e-reader magnetized to the back, peeking out offset -->
  <g transform="rotate(6 236 130)">
    <rect x="188" y="52" width="96" height="156" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <rect x="198" y="62" width="76" height="112" fill="none" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="76" x2="267" y2="76" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="90" x2="267" y2="90" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="104" x2="259" y2="104" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="118" x2="267" y2="118" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="132" x2="252" y2="132" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="146" x2="267" y2="146" stroke="#b45309" stroke-width="2"/>
    <line x1="205" y1="160" x2="245" y2="160" stroke="#b45309" stroke-width="2"/>
    <circle cx="222" cy="190" r="4" fill="none" stroke="#b45309" stroke-width="2"/>
    <circle cx="250" cy="190" r="4" fill="none" stroke="#b45309" stroke-width="2"/>
  </g>
  <!-- magnet snap marks -->
  <path d="M196 108 l-14 -6 M196 130 l-15 0 M196 152 l-14 6" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- tiny book beside the phone -->
  <g transform="rotate(-5 62 190)">
    <path d="M34 158 C48 150, 60 150, 70 157 L70 214 C60 207, 48 207, 34 214 Z" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <path d="M98 158 C84 150, 72 150, 70 157 L70 214 C72 207, 84 207, 98 214 Z" fill="#fffbeb" stroke="#b45309" stroke-width="3"/>
    <line x1="70" y1="157" x2="70" y2="214" stroke="#b45309" stroke-width="2"/>
    <line x1="42" y1="168" x2="62" y2="164" stroke="#b45309" stroke-width="2"/>
    <line x1="42" y1="182" x2="62" y2="178" stroke="#b45309" stroke-width="2"/>
    <line x1="78" y1="164" x2="92" y2="168" stroke="#b45309" stroke-width="2"/>
    <line x1="78" y1="178" x2="92" y2="182" stroke="#b45309" stroke-width="2"/>
  </g>
</svg>
