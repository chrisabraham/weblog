<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ai-roundup-debut-won-day-lost-t ai-roundup-debut-won-day-lost-d">
<title id="ai-roundup-debut-won-day-lost-t">A stock ticker where the newcomer rises and the market falls</title>
<desc id="ai-roundup-debut-won-day-lost-d">A black stock ticker board shows ANT up 17 percent in green with a rising arrow and confetti, and beneath it DOW down 1,100 in red with a falling arrow, while a tiny party hat sits on the green line.</desc>
<rect width="1200" height="675" fill="#fdf8ee"/>
<path d="M0 600 h1200" stroke="#7a9ab0" stroke-width="3"/>
<rect x="150" y="90" width="900" height="420" rx="16" fill="#1d2a33"/>
<text x="230" y="230" font-family="Verdana, sans-serif" font-size="72" font-weight="bold" fill="#7fe08a">ANT +17%</text>
<path d="M800 240 l90 -110 l90 110 m-90 -110 v170" fill="none" stroke="#7fe08a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<text x="230" y="420" font-family="Verdana, sans-serif" font-size="72" font-weight="bold" fill="#ff6b5b">DOW -1,100</text>
<path d="M800 320 l90 110 l90 -110 m-90 110 v-170" fill="none" stroke="#ff6b5b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 150 l40 -90 l40 90 z" fill="#c75000"/>
<g fill="#f2c14e"><rect x="300" y="60" width="12" height="12" transform="rotate(20 306 66)"/><rect x="480" y="50" width="12" height="12"/><rect x="560" y="80" width="12" height="12" transform="rotate(40 566 86)"/><rect x="250" y="40" width="12" height="12"/></g>
<text x="600" y="570" text-anchor="middle" font-family="Verdana, sans-serif" font-size="26" fill="#16729e">the debut won, the day lost</text>
</svg>
