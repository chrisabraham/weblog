 <rect x="81" y="-68" width="43" height="24" rx="5" fill="#c0a995"/>
</g>
<!-- One fresh red correction in an otherwise finished page. -->
<path d="M293 580l18 10 24-27" stroke="#a22f40" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M928 513q38-29 80-7t69-4" fill="none" stroke="#f0d3a4" stroke-width="4" stroke-dasharray="7 13" opacity=".7"/>
</svg>