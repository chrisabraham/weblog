<path d="M211 60v249M68 188h296" stroke="#775e48" stroke-width="12"/>
<!-- The newspaper wall, where the results are visible. -->
<rect x="752" y="62" width="393" height="362" rx="12" fill="#644737" stroke="#c6a87f" stroke-width="13"/>
<rect x="772" y="81" width="354" height="323" rx="4" fill="#a57e54"/>
