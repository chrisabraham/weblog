 <rect x="30" y="161" width="110" height="111" rx="3" fill="#f5e4c0" transform="rotate(4 85 215)"/>
 <rect x="164" y="169" width="143" height="111" rx="3" fill="url(#paper)" transform="rotate(-6 232 223)"/>
 <g stroke="#718a92" stroke-width="5" opacity=".9"><path d="M36 47h58M36 60h71M36 73h62M36 86h47M147 44h55M147 58h49M147 72h62M147 87h41M250 60h59M250 75h58M250 90h38M45 205h75M45 220h69M45 235h46M184 213h105M184 228h91M184 243h95"/></g>
 <g fill="#b33d42"><circle cx="66" cy="14" r="6"/><circle cx="182" cy="10" r="6"/><circle cx="278" cy="24" r="6"/><circle cx="82" cy="170" r="6"/><circle cx="230" cy="171" r="6"/></g>
