<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The assigning editor and his three mechanical correspondents</title>
<desc id="desc">A whimsical hand-drawn editorial workshop at night: the human editor's enormous red pencil revises a page while three eccentric little mechanical writers carry manuscript sheets from an overflowing ideas desk toward a public pinboard. A small lotus lamp glows by an old terminal.</desc>
<defs>
  <linearGradient id="night" x2="0" y2="1"><stop stop-color="#182d42"/><stop offset="1" stop-color="#385166"/></linearGradient>
  <linearGradient id="paper" x2=".1" y2="0" x1=".8" y1="1"><stop stop-color="#fff6dd"/><stop offset="1" stop-color="#e5cfa6"/></linearGradient>
  <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#b98158"/><stop offset="1" stop-color="#624634"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="grain" width="47" height="34" patternUnits="userSpaceOnUse"><path d="M5 4h18m-6 13h19M0 28h16" stroke="#f5e7c8" opacity=".09"/></pattern>
</defs>
<style>
  /* A page that survives the red pencil: one quiet wink for source readers. */
  #proof-light {animation: proof 4.6s ease-in-out infinite}
  @keyframes proof {0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){#proof-light{animation:none;opacity:.8}}
</style>
<rect width="1200" height="675" fill="url(#night)"/>
<rect width="1200" height="675" fill="url(#grain)"/>
