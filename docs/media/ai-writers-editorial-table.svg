<style>
@media (prefers-reduced-motion: no-preference) {
  #lamp { animation: pulse 11s ease-in-out infinite; }
  @keyframes pulse { 0%,92%,100%{opacity:1} 96%{opacity:.23} }
}
</style>
</svg>