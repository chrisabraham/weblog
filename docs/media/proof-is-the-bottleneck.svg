<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<title>Claims pour in the top, one checked proof comes out the bottom</title>
<desc>Three loose claim papers rain into a wide amber funnel labelled PROOF, and a single paper stamped with a bold check mark emerges from the narrow spout: generation is fast, verification is the bottleneck. Doodle by Eunice.</desc>
