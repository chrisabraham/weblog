<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<title>Open weights outweigh a flat payoff chart</title>
<desc>A balance scale tips hard toward two brass calibration weights, the big one stamped 3T, while the high pan carries only a paper payoff chart whose line climbs once and flatlines, tagged plus-or-minus zero: the weights are real and downloadable, the returns are not yet. Doodle by Eunice.</desc>
