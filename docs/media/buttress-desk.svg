<title id="t">A cathedral wall with a stained glass window, a flying buttress arching out to a pier, and a small desk with a lamp standing at the pier</title>
<desc id="d">Amber ink doodle by Eunice: the wall and its glowing window on the left, the stone arch of a flying buttress reaching out to a plain pier on the right, and at the foot of the pier a tiny desk with a lamp, a telephone, and a stack of paper, the switchboard outside the wall.</desc>
