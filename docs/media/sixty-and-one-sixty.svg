<g font-family="Georgia, serif" fill="#92400e">
<text x="352" y="240" font-size="44" font-weight="bold">60</text>
<text x="330" y="196" font-size="27">a title lives here</text>
<text x="952" y="222" font-size="44" font-weight="bold">160</text>
<text x="876" y="178" font-size="27">a description ends here</text>
<text x="120" y="560" font-size="30" font-style="italic">A title is a sentence, not a breadcrumb.</text>
</g>
