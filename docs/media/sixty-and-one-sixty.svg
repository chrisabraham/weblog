<title id="t">The 60 and 160 ruler</title>
<desc id="d">A hand drawn amber ruler with marks at 60 for titles and 160 for descriptions, a pair of reading glasses, and a speech bubble.</desc>
<g fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
