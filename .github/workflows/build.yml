# Build reproducibly from source and preserve a traceable build commit.
# GitHub Pages serves docs/ on main; do not hand-edit generated pages.
name: Rebuild and verify weblog
on:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "src/**"
      - "tools/**"
      - "fonts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weblog-build-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow for share cards
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Build all generated pages and assets
        run: python build.py
      - name: Existing SEO and source link audit
        run: python tools/audit.py | tee /tmp/weblog-audit.txt
      - name: Enforce existing audit output
        run: grep -qx 'No issues.' /tmp/weblog-audit.txt
      - name: Validate homepage, images, attribution and links
        run: python tools/test_regressions.py
      - name: Commit generated output and preserve evidence
        run: |
          git config user.name "weblog build automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs/ already current."
          else
            git commit -m "build: generated site from verified sources [skip ci]"
            git push origin HEAD:main
          fi
