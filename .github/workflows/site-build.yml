# Rebuild and commit the published GitHub Pages files when source changes.
# The docs-only commit skips this workflow, preventing recursive builds.
name: Build and audit weblog
on:
  push:
    branches: [main, chatgpt-housekeeping-20261016]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: weblog-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install share-card dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate site and capture warnings
        run: |
          python build.py | tee /tmp/weblog-build.log
          if grep -E '(^|[[:space:]])warn([[:space:]:]|$)' /tmp/weblog-build.log; then
            echo "Builder warnings found; refusing to publish."
            exit 1
          fi
      - name: Existing broken-link and metadata audit
        run: |
          python tools/audit.py | tee /tmp/weblog-audit.log
          grep -Fx "No issues." /tmp/weblog-audit.log
      - name: Homepage, keyboard navigation, wiki and author regression tests
        run: python tools/verify_housekeeping.py
      - name: Save reproducible generated site
        run: |
          git config user.name "ChatGPT site build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Generated site already matches source."
          else
            git commit -m "build(web): regenerate audited GitHub Pages files [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
